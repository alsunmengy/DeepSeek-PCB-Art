name: Update star history

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 UTC 3:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: star-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate chart (创立至今 · 主题色 + 插画背景)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gen_chart.py "$GITHUB_REPOSITORY" "#4D6BFE" .github/star-history/chart.svg "#B07E1E" .github/star-history/bg.jpg "DeepSeek 人鱼少女"

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/star-history/chart.svg
          git diff --cached --quiet || git commit -m "chore: update star history"
          git push
