name: Update download history

on:
  schedule:
    - cron: "20 3 * * *"   # 每天 UTC 3:20（错开 star history 的 3:10）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: download-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot download counts + regenerate chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gen_download_chart.py "$GITHUB_REPOSITORY" "#4D6BFE" .github/download-history/chart.svg "" "" --snapshot

      - name: Commit chart + snapshot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/download-history/chart.svg .github/download-history/history.json
          git diff --cached --quiet || git commit -m "chore: update download history"
          git push
